[project]
name = "langchain-py"
version = "0.1.0"
description = "LangChain 学习项目"
authors = [
    { name = "v-kkhuang", email = "420895376@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
